<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cashflow UA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Г5 «Сонячне літо»: тепле жовте небо, соковита трава, червоні дахи, синій акцент, зелені гроші. Одна світла тема. */
:root{
  --sky:#FFF6D6; --top:#FFFDF3; --ink:#2A2418; --mute:#8C7B55; --line:rgba(70,55,20,.14); --line2:rgba(70,55,20,.24);
  --grass:#8FD46B; --grass2:#B5E68F; --road:#FFE08A; --wall:#FFFFFF; --w2:#FFD86B; --w3:#F5B93D; --roof:#FF5A3D;
  --blue:#2D8CFF; --blue2:#1F6FD6; --money:#16A34A; --bad:#E5484D; --warn:#F08A24; --violet:#7B61FF; --card:#FFFFFF; --soft:#FFF1C2;
  --f-d:"Rubik","Manrope",system-ui,sans-serif; --f-b:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,#BDE6FF 0%,#E3F5FF 32%,#FFF6D6 70%,#FFEDB8 100%);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:10px}
.num{font-family:var(--f-d);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-d);margin:0;text-wrap:balance;font-weight:700}
.muted{color:var(--mute)} .good{color:var(--money)} .bad{color:var(--bad)} .blue{color:var(--blue)}
.hide{display:none!important}
#app{height:100%;display:flex;flex-direction:column;position:relative;z-index:1}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#scenery{position:absolute;left:0;right:0;bottom:0;width:100%;height:42vh;opacity:.6}
.cloud{position:absolute;background:#fff;border-radius:60px;opacity:.85;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:150%;left:15%;top:-60%}.cloud::after{width:40%;height:120%;right:12%;top:-40%}
.c1{width:160px;height:44px;top:9%;animation-duration:90s;animation-delay:-20s}.c2{width:110px;height:32px;top:22%;animation-duration:120s;animation-delay:-70s;opacity:.7}.c3{width:200px;height:52px;top:4%;animation-duration:150s;animation-delay:-110s;opacity:.6}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(110vw)}}
.scroll{overflow-y:auto;height:100%}

/* загрузка */
#boot{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:linear-gradient(180deg,#FFF3C4 0%,#FFF8E2 55%,#C9EBA9 100%);transition:opacity .6s,visibility .6s}
#boot.out{opacity:0;visibility:hidden}
.bcore{display:grid;justify-items:center;gap:18px;padding:24px;text-align:center}
.bsun{position:absolute;top:8%;right:12%;width:90px;height:90px;border-radius:50%;background:#FFD23F;box-shadow:0 0 0 18px rgba(255,210,63,.25),0 0 0 40px rgba(255,210,63,.12);animation:sun 6s ease-in-out infinite}
@keyframes sun{50%{transform:translateY(-8px) scale(1.04)}}
.blogo{font-family:var(--f-d);font-weight:800;font-size:clamp(30px,7vw,52px);letter-spacing:.02em;line-height:1}
.blogo b{color:var(--money)} .blogo i{font-style:normal;color:var(--blue)}
.bbar{width:min(320px,80vw);height:10px;border-radius:10px;background:rgba(42,36,24,.08);overflow:hidden}
.bbar span{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,var(--money),#8FD46B);transition:width .35s}
.blog{font-size:13px;color:var(--mute);min-height:20px}
.bcity{width:min(360px,86vw)}
.bill{animation:billfly 2.2s ease-in-out infinite}
@keyframes billfly{0%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(4deg)}100%{transform:translateY(0) rotate(-6deg)}}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:14px;font-weight:800;background:#fff;border:2px solid var(--line2);transition:transform .12s,box-shadow .2s;text-align:center;box-shadow:0 3px 0 var(--line2)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line2)}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue2);box-shadow:0 4px 0 var(--blue2)}
.btn.go{background:var(--money);color:#fff;border-color:#0F7A36;box-shadow:0 4px 0 #0F7A36}
.btn.sun{background:#FFC93C;color:#3A2A00;border-color:#E0A800;box-shadow:0 4px 0 #E0A800}
.btn.red{background:#fff;color:var(--bad);border-color:rgba(229,72,77,.45);box-shadow:0 3px 0 rgba(229,72,77,.35)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent}
.btn.sm{min-height:36px;padding:6px 12px;border-radius:11px;font-size:13px;box-shadow:0 2px 0 var(--line2)}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;background:#fff;border:1.5px solid var(--line2);white-space:nowrap}
.pill.g{color:var(--money);border-color:rgba(22,163,74,.4)} .pill.o{color:var(--warn);border-color:rgba(240,138,36,.45)} .pill.b{color:var(--blue);border-color:rgba(45,140,255,.4)}
input[type=text],input[type=number],select,textarea{background:#fff;border:2px solid var(--line2);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
textarea{min-height:160px;resize:vertical;line-height:1.5}
input[type=range]{width:100%;accent-color:var(--blue)}
label.f{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--mute)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px}
.note{font-size:13.5px;color:#5E5236;padding:10px 12px;border-radius:14px;background:var(--soft);border:1.5px solid rgba(224,168,0,.25)}

/* верхня панель */
.top{flex:none;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;padding:calc(var(--safe-t) + 8px) 12px 6px;background:rgba(255,253,243,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid var(--line)}
.ib{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#fff;border:2px solid var(--line);position:relative}
.ib svg{width:24px;height:24px}
.ib .dotn{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.bal{text-align:center;line-height:1.05;cursor:pointer;border-radius:14px;padding:2px}
.bal small{display:block;font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.04em}
.bal b{font-family:var(--f-d);font-size:28px;font-weight:700;color:var(--money)}
.bal b.neg{color:var(--bad)}
.bal em{display:block;font-style:normal;font-size:12px;font-weight:700;color:var(--mute)}
.me{width:46px;height:46px;border-radius:50%;border:3px solid var(--blue);overflow:hidden;background:#fff;padding:0}
.me img{width:100%;height:100%;object-fit:cover;display:block}
.strip{flex:none;display:flex;gap:8px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.pchip{flex:none;display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:999px;background:#fff;border:2px solid var(--line);font-size:13px;font-weight:800}
.pchip img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.pchip.cur{border-color:var(--blue);box-shadow:0 0 0 3px rgba(45,140,255,.18)}
.pchip .c{font-family:var(--f-d);font-size:12px;color:var(--mute)}
.pchip .md{font-size:16px}
.pchip .off{width:8px;height:8px;border-radius:50%;background:#CFC6AE}
.pchip .on{width:8px;height:8px;border-radius:50%;background:var(--money)}

/* поле */
.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;padding:6px 6px 6px}
#board{width:100%;height:100%;max-width:1100px;display:block}
.tile{cursor:pointer}
.tok{transition:transform .2s ease-out}
.datebadge{display:none;position:absolute;left:12px;top:6px;font-family:var(--f-d);font-weight:700;font-size:13px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px 10px}
.fxbadge{position:absolute;right:12px;top:6px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}

/* нижня панель */
.bottom{flex:none;display:grid;grid-template-columns:auto minmax(0,640px) auto;justify-content:center;gap:10px;align-items:center;padding:10px 12px calc(var(--safe-b) + 10px);background:rgba(255,253,243,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:2px solid var(--line)}
.bottom .main{min-height:56px;font-size:17px;font-family:var(--f-d);letter-spacing:.01em}
.timer{width:58px;height:58px;position:relative;flex:none}
.timer svg{width:58px;height:58px;transform:rotate(-90deg)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-d);font-size:14px;font-weight:700}
.timer.low b{color:var(--bad)} .timer.low{animation:pulse .5s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.waitline{font-weight:800;display:flex;align-items:center;gap:8px;min-height:56px}
.waitline img{width:32px;height:32px;border-radius:50%}
.banner{position:absolute;left:10px;right:10px;bottom:8px;margin:0 auto;max-width:620px;background:#fff;border:2px solid var(--blue);border-radius:18px;padding:10px 12px;display:grid;gap:8px;box-shadow:0 10px 30px -12px rgba(42,36,24,.35);animation:rise .35s cubic-bezier(.2,.9,.3,1.2)}
.banner .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@keyframes rise{from{transform:translateY(20px);opacity:0}}

/* лист, меню */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(42,36,24,.35);display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(580px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;border-radius:26px;background:var(--top);border:2px solid var(--line);box-shadow:0 30px 60px -20px rgba(42,36,24,.45);animation:pop .35s cubic-bezier(.2,.9,.3,1.25)}
@keyframes pop{from{transform:translateY(24px) scale(.96);opacity:0}}
@media(max-width:640px){.scrim{place-items:end center;padding:0}.sheet{border-radius:26px 26px 0 0;max-height:92dvh;padding-bottom:var(--safe-b);animation:up .35s cubic-bezier(.2,.9,.3,1)}@keyframes up{from{transform:translateY(70%)}}}
.shead{display:flex;align-items:center;gap:12px;padding:16px 18px 10px;position:sticky;top:0;background:var(--top);z-index:2;border-bottom:2px solid var(--line)}
.shead h2{font-size:20px;flex:1}
.sbody{padding:14px 18px 20px;display:grid;gap:14px}
.sbody p{margin:0;white-space:pre-line}
.art{height:150px;display:grid;place-items:center;background:linear-gradient(180deg,#FFF3C4,#FFF9E6);border-bottom:2px solid var(--line);position:relative;overflow:hidden}
.art svg{height:130px;width:auto}
.art.sc{height:180px;padding:0;background:none}.art.sc svg{width:100%;height:100%}
.rules-full details.rsec{background:#fff;border:2px solid var(--line);border-radius:16px;padding:0}
.rules-full summary{cursor:pointer;font-family:var(--f-d);font-weight:700;font-size:16px;padding:14px 16px;list-style:none}
.rules-full summary::-webkit-details-marker{display:none}
.rules-full summary::after{content:'＋';float:right;color:var(--blue)}
.rules-full details[open] summary::after{content:'－'}
.rules-full .rbody{padding:0 16px 14px;font-size:14.5px;line-height:1.55}
.rules-full ul{margin:0;padding-left:18px;display:grid;gap:6px}
.rules-full p{margin:0 0 8px}
.avpick{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.avpick button{font-size:26px;height:46px;border-radius:12px;background:#fff;border:2px solid var(--line)}
.avpick button.on{border-color:var(--blue);background:#EAF3FF;box-shadow:0 0 0 3px rgba(45,140,255,.2)}
.kicker{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.rows{display:grid;border:2px solid var(--line);border-radius:16px;overflow:hidden}
.rows div{display:grid;grid-template-columns:1fr auto;gap:12px;padding:9px 12px;font-size:14px;background:#fff}
.rows div:nth-child(even){background:#FFFBEC}
.rows span:last-child{font-family:var(--f-d);text-align:right;font-weight:600}
.opts{display:grid;gap:8px}
.opts .btn{justify-content:flex-start;text-align:left;min-height:52px}
.res{padding:14px;border-radius:16px;background:#EAF7EE;border:2px solid rgba(22,163,74,.3);font-weight:700}
.res.badr{background:#FDECEC;border-color:rgba(229,72,77,.3)}
.tip{font-size:13.5px;color:#7A5A00;background:var(--soft);border-radius:14px;padding:10px 12px}
.amt{display:grid;gap:8px;padding:12px;border-radius:16px;background:#fff;border:2px solid var(--line)}
.amt .q{display:flex;gap:6px}.amt .q button{flex:1}
.drawer{position:fixed;inset:0;z-index:70;background:rgba(42,36,24,.35);animation:fade .2s}
.drawer nav{position:absolute;left:0;top:0;bottom:0;width:min(330px,88vw);background:var(--top);border-right:2px solid var(--line);padding:calc(var(--safe-t) + 14px) 12px 20px;overflow-y:auto;display:grid;align-content:start;gap:4px;animation:slide .3s cubic-bezier(.2,.9,.3,1)}
@keyframes slide{from{transform:translateX(-100%)}}
.mi{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;font-weight:800;text-align:left;width:100%}
.mi:hover{background:#FFF1C2}
.mi .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:#fff;border:2px solid var(--line);flex:none}
.mi .sub{display:block;font-size:12px;font-weight:600;color:var(--mute)}
.mhd{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:12px 12px 4px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:12px;border-radius:16px;background:#fff;border:2px solid var(--line)}
.kpi .l{font-size:11.5px;color:var(--mute);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-family:var(--f-d);font-size:20px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.free{padding:14px;border-radius:18px;background:#fff;border:2px solid var(--line)}
.free .bar{height:14px;border-radius:14px;background:#F3EBD2;overflow:hidden;margin:8px 0 6px}
.free .bar i{display:block;height:100%;border-radius:14px;background:linear-gradient(90deg,var(--money),#8FD46B);transition:width .8s}
.sect h3{font-size:12px;font-family:var(--f-b);font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.lines{display:grid;background:#fff;border:2px solid var(--line);border-radius:16px;padding:4px 12px}
.ln{display:grid;grid-template-columns:1fr auto;gap:10px;padding:8px 0;border-bottom:1.5px dashed var(--line);font-size:14px;align-items:center}
.ln:last-child{border-bottom:0}
.ln .num{font-weight:600}
.ln.tot{font-weight:800}
.meters{display:grid;gap:9px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px}
.meter{display:grid;grid-template-columns:100px 1fr 34px;gap:10px;align-items:center;font-size:13px;font-weight:700}
.meter .t{height:10px;border-radius:10px;background:#F3EBD2;overflow:hidden}
.meter .t i{display:block;height:100%;border-radius:10px}
.asset{display:grid;gap:6px;padding:12px;border-radius:16px;background:#fff;border:2px solid var(--line)}
.asset .h{display:flex;justify-content:space-between;gap:10px;font-weight:800}
.asset .s{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.asset .a{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:7px;background:#FFF1C2;color:#7A5A00}
.mkt{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;background:#fff;border:2px solid var(--line)}
.spark{width:70px;height:26px}
.toggle{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px;border-radius:16px;background:#fff;border:2px solid var(--line)}
.sw{width:52px;height:30px;border-radius:30px;background:#E6DDC4;position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--money)} .sw.on::after{transform:translateX(22px)}
.log{display:grid;gap:6px;font-size:13.5px}
.lg{padding:8px 10px;border-radius:12px;background:#fff;border:2px solid var(--line)}
.lg.good,.lg.pay{border-color:rgba(22,163,74,.35)} .lg.bad{border-color:rgba(229,72,77,.35)} .lg.news{border-color:rgba(240,138,36,.45);background:#FFF8E6} .lg.win{border-color:var(--blue);background:#EEF5FF}
.lg .mm{font-size:11px;color:var(--mute);font-weight:700}
.lg .who{font-weight:800;margin-right:4px}
.plist{display:grid;gap:8px}
.pl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:16px;background:#fff;border:2px solid var(--line);text-align:left;width:100%}
.pl img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.pl .nm{font-weight:800}
.pl .sub{font-size:12.5px;color:var(--mute);font-weight:600}
.dtab{display:flex;gap:6px;flex-wrap:wrap}
.dtab button{padding:7px 12px;border-radius:11px;font-weight:800;font-size:13px;background:#fff;border:2px solid var(--line)}
.dtab button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
table.dt{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:14px;overflow:hidden}
table.dt th,table.dt td{padding:7px 8px;border-bottom:1.5px solid var(--line);text-align:right;white-space:nowrap}
table.dt th:first-child,table.dt td:first-child{text-align:left}
table.dt th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);background:#FFFBEC}
.tw{overflow-x:auto;border:2px solid var(--line);border-radius:14px}
.chk{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--blue)}
.slot{font-family:var(--f-d);font-size:22px;font-weight:700;text-align:center;padding:18px;border-radius:18px;background:#fff;border:3px dashed var(--line2);min-height:72px;display:grid;place-items:center}
.slot.spin{animation:jig .12s linear infinite}
@keyframes jig{50%{transform:translateY(-3px)}}

/* лобі */
.lob{height:100%;overflow-y:auto}
.lwrap{max-width:1100px;margin:0 auto;padding:calc(var(--safe-t) + 18px) 16px 40px;display:grid;gap:18px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:center}
@media(max-width:800px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.05}
.hero h1 b{color:var(--money)}
.lgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
@media(max-width:800px){.lgrid{grid-template-columns:1fr}}
.gitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px;border-radius:16px;background:#fff;border:2px solid var(--line)}
.avs{display:flex}.avs img{width:26px;height:26px;border-radius:50%;border:2px solid #fff;margin-left:-7px}.avs img:first-child{margin-left:0}
.rules{display:grid;gap:10px;font-size:14.5px}
.step{display:grid;grid-template-columns:30px 1fr;gap:10px}
.step i{font-style:normal;width:28px;height:28px;border-radius:9px;background:#FFC93C;display:grid;place-items:center;font-weight:800;font-family:var(--f-d)}

/* ефекти */

function sceneFor(v) {
  const id = v.id || '';
  const S_ = (k, s) => SCENE[k](s);
  if (id === 'd_vac') return S_('mountains');
  if (v.deck === 'dream') return S_('beach');
  if (id === 'choose') return S_('city');
  if (v.deck === 'pay' || v.deck === 'luck') return S_('money');
  if (v.art === 'tk' || /^s_(spx|ai_|gold|btc|eth|meme)|^m_(bump|split|bust|crypto|fxjump)/.test(id)) return S_('exchange');
  if (/^(s_ovdp|s_usdbond|s_dep|s_friend|m_friend)/.test(id)) return S_('bankhall');
  if (/^(b_sto|s_tools|d_car_repair|d_tires|d_pothole)/.test(id)) return S_('garage');
  if (/^b_wash/.test(id)) return S_('wash');
  if (/^(s_ev|s_gen|d_fuel)/.test(id)) return S_('charge');
  if (/^(s_vend|s_kiosk|b_coffee|b_vend6|b_pizza|m_compet|d_latte)/.test(id)) return S_('cafe');
  if (/^b_santeh/.test(id)) return S_('santeh');
  if (/^(b_solar|f_ses)/.test(id)) return S_('solar');
  if (/^(b_fpv|s_3d|f_drone)/.test(id)) return S_('factory');
  if (/^b_laundry/.test(id)) return S_('laundry');
  if (/^(b_house)/.test(id)) return S_('cottage');
  if (/^(s_land|m_land|f_agro)/.test(id)) return S_('land', id === 'm_land' ? 'КУПЛЮ' : null);
  if (/^(s_garage|s_park|m_garage)/.test(id)) return S_('parking', id === 'm_garage' ? 'КУПЛЮ' : null);
  if (/^(s_newbuild|m_nb)/.test(id)) return S_('build', id === 'm_nbfreeze' ? 'ЗАМОРОЖЕНО' : id === 'm_nb' ? 'КУПЛЮ' : null);
  if (/^(b_sklad|f_wh)/.test(id)) return S_('warehouse');
  if (/^(b_comm|m_comm|f_mall)/.test(id)) return S_('shopfront', id === 'm_comm' ? 'ШУКАЮ' : null);
  if (/^(s_smart|s_stryi|b_flat|b_dohid|m_flat|m_tenant|m_rentup|m_osbb|m_missile|f_rebuild|f_hotel)/.test(id)) return S_('flat', id === 'm_flat' ? 'КУПЛЮ' : id === 'm_tenant' ? 'ЗДАЄТЬСЯ' : id === 'm_rentup' ? 'ОРЕНДА ↑' : null);
  if (/^(fr_raid|fr_suit|fr_divorce|fr_tax|m_tax)/.test(id)) return S_('court');
  if (v.deck === 'ftdeal' || /^f_/.test(id)) return S_('skyline');
  if (v.deck === 'ai' || /^b_aischool/.test(id)) return S_('ai');
  if (/^(s_prom|s_tg|m_biz|u_bonus|u_raise|u_client|fr_|g_gig)/.test(id) || v.deck === 'gig') return S_('office');
  const BYDECK = { health: 'clinic', psy: 'calm', child: 'family', news: 'newsroom', ftnews: 'newsroom', spend: 'street', charity: 'charity', layoff: 'layoff', ftrisk: 'court', market: 'city', small: 'city', big: 'city' };
  return BYDECK[v.deck] ? S_(BYDECK[v.deck]) : null;
}
function rulesFull() {

  + S2('1. Коротко: як виграти', '<p>Ви — звичайна людина з роботою, зарплатою, орендою і кредитами. Мета — вирватися з «щурячих перегонів»: зробити так, щоб <b>пасивний дохід</b> (оренда, бізнес, дивіденди, відсотки) став <b>більшим за всі ваші щомісячні витрати</b>. Тоді ви фінансово вільні й переходите на внутрішнє коло — Швидку доріжку. Там перемагає той, хто першим здійснить свою мрію або збільшить пасивний дохід ще на 300 000 ₴ на місяць.</p><p>Секрет простий і складний водночас: купувати активи, які приносять гроші щомісяця, а не пасиви, які гроші забирають.</p>', true)

/* ================= стан / права ================= */
const actor = () => { const g = S.g; if (!g) return null; if (g.local) return (g.pending && g.pending.owner) || CF.curUid(g); return S.me.id; };
const myUid = () => (S.g && S.g.local) ? CF.curUid(S.g) : S.me.id;
const isMyTurn = () => { const g = S.g; if (!g || g.status !== 'active') return false; return g.local ? true : CF.curUid(g) === S.me.id; };
const iDecide = () => { const g = S.g; if (!g || !g.pending) return false; return g.local ? true : g.pending.owner === S.me.id; };
const isHost = () => S.g && (S.g.local || S.g.hostId === S.me.id);
const joined = () => S.g && (S.g.local || !!(S.g.players || {})[S.me.id]);
function diff(a, b) {
  const out = {}; let ch = false;
  const keys = new Set(Object.keys(a || {}).concat(Object.keys(b || {})));
  keys.forEach((k) => {
    if (k === 'id') return;
    const x = a ? a[k] : undefined, y = b ? b[k] : undefined;
    if (y === undefined) { if (x !== undefined && x !== null) { out[k] = null; ch = true; } return; }
    if (y && typeof y === 'object' && !Array.isArray(y) && x && typeof x === 'object' && !Array.isArray(x)) { const d = diff(x, y); if (d) { out[k] = d; ch = true; } return; }
    if (JSON.stringify(x) !== JSON.stringify(y)) { out[k] = y === undefined ? null : y; ch = true; }
  });
  return ch ? out : null;
}
async function commit(fn) {
  if (!S.g) return;
  const base = S.g; const g = JSON.parse(JSON.stringify(base));
  CF.setCtx(g); let ret;
  try { ret = fn(g); } catch (e) { console.error(e); toast('Помилка гри: ' + esc(e.message), 'bad'); return; }
  g.seq = (g.seq || 0) + 1; g.updatedAt = Date.now();
  S.g = g; onState(base);
  if (g.local) return ret;
  const d = diff(base, g); if (!d) return ret;
  S.writing++;
  try { await S.db.doc('games/' + S.gid).update(d); }
  catch (e) { toast(e.code === 'invalid_argument' ? 'Немає прав на запис. Власник гри має дати вам доступ рівня Contributor.' : 'Хід не зберігся (' + esc(e.code || 'помилка') + '). Спробуйте ще раз.', 'bad', 6000); }
  finally { S.writing--; }
  return ret;
}

/* ================= реакція на зміни ================= */
function onState(prev) {
  const g = S.g; if (!g) return render(); CF.setCtx(g);

  if (g.fx && g.fx.t !== S.lastFx) { S.lastFx = g.fx.t; if (prev) { FX.confetti(180); SND.win(); toast('<b>' + esc(nameOf(g.fx.uid)) + '</b> ' + (g.fx.k === 'win' ? 'перемагає! 🏆' : 'виходить на Швидку доріжку! 🚀'), 'good', 5000); } }

function tickLoop() {
  const g = S.g; if (!g || g.status !== 'active') return;
  const el = $('#timer'); const dl = g.deadline; const now = Date.now();
  if (g.paused) { if (el) el.innerHTML = timerSVG(1, '⏸', false); return; }
  if (!dl) { if (el) el.innerHTML = ''; return; }
  const left = Math.max(0, dl - now); const total = (g.phase === 'roll' ? (g.rules.roll || 30) : (g.rules.dec || 180)) * 1000;
  const sec = Math.ceil(left / 1000);
  if (el) { const low = sec <= 10; el.className = 'timer' + (low ? ' low' : ''); el.innerHTML = timerSVG(Math.min(1, left / total), Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'), low, sec); }
  const acting = isMyTurn() || iDecide();
  if (acting && left > 0) {
    const fast = sec <= 10; const iv = fast ? 500 : 1000;
    if (now - S.lastTick >= iv - 20) { S.lastTick = now; SND.tick(fast); }
    [60, 30, 10].forEach((w) => { if (sec <= w && sec > w - 2 && !S.warned[w] && total > w * 1000 + 2000) { S.warned[w] = 1; SND.warn(w); toast(w === 60 ? 'Залишилась 1 хвилина' : 'Залишилось ' + w + ' секунд', w === 10 ? 'bad' : '', 2200); } });
  }
  if (left <= 0 && S.autoFired !== dl) {
    const late = now - dl; const cur = CF.curUid(g);
    const mine = g.local || cur === S.me.id; const host = isHost(); const anyone = joined();
    if (mine || (host && late > 4000) || (anyone && late > 12000)) { S.autoFired = dl; closeAll(); commit((g2) => { if (g2.deadline === dl) CF.timeout(g2); }); }
  }
}

function diaryRef(id) { return S.db.doc('data/users/' + S.me.id + '/d-' + id); }
async function loadDiary(id) {
  S.diary = { notes: '', tk: {}, mk: [], news: [], seen: {} };
  if (!S.db || !S.me.id) return;
  try { const s = await diaryRef(id).get(); if (s.exists) S.diary = Object.assign({ notes: '', tk: {}, mk: [], news: [], seen: {} }, s.data()); } catch (e) {}
  if (S.g) diaryObserve(S.g);
}
let dTimer = null;
function saveDiary(now) {
  if (!S.diaryDirty || !S.diary || !S.db || !S.me.id || !S.gid || S.gid === 'local') return;
  clearTimeout(dTimer);
  const go2 = async () => { S.diaryDirty = false; const d = JSON.parse(JSON.stringify(S.diary)); d.mk = d.mk.slice(-120); d.news = d.news.slice(-80); Object.keys(d.tk).forEach((k) => { d.tk[k] = d.tk[k].slice(-60); }); try { await diaryRef(S.gid).set(d); } catch (e) { S.diaryDirty = true; } };
  if (now) go2(); else dTimer = setTimeout(go2, 2500);
}
function curDiary() { const g = S.g; if (g && g.local) { const u = CF.curUid(g); S.localDiary[u] = S.localDiary[u] || { notes: '', tk: {}, mk: [], news: [], seen: {} }; return S.localDiary[u]; } return S.diary; }
function diaryObserve(g) {
  const D = curDiary(); if (!D) return; let ch = false; const w = g.world;
  if (!D.mk.some((x) => x[0] === w.m)) { D.mk.push([w.m, +w.fx.toFixed(2), w.rate, Math.round(w.px.SPX), Math.round(w.px.BTC), Math.round(w.px.ETH), Math.round(w.px.GOLD), +(+w.px.MEME).toFixed(4), +((w.infl || .1) * 100).toFixed(1)]); ch = true; }
  (w.news || []).forEach((n) => { const k = n.m + ':' + n.id; if (!D.seen[k]) { D.seen[k] = 1; D.news.push([n.m, n.t, n.e]); ch = true; } });
  const pd = g.pending; if (pd && pd.p && pd.p.sym && pd.p.price && CF.TK[pd.p.sym]) { const k = 'tk:' + pd.p.sym + ':' + w.m + ':' + (g.turn) + ':' + (g.round || 0); if (!D.seen[k]) { D.seen[k] = 1; (D.tk[pd.p.sym] = D.tk[pd.p.sym] || []).push([w.m, pd.p.price]); ch = true; } }
  if (ch) { if (!g.local) { S.diaryDirty = true; saveDiary(); } }
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-go], [data-sheet], .tile'); if (!t) return;
  SND.init();
  if (t.classList.contains('tile')) { const k = t.getAttribute('data-tile'); const fast = k.startsWith('fast'); const c = (fast ? CF.FAST : CF.RAT)[+k.replace(/\D/g, '')]; toast(esc(CNAME[c] || CF.CELL[c].n) + (fast ? ' · Швидка доріжка' : ''), '', 1800); return; }
  if (t.hasAttribute('data-go')) { go(t.getAttribute('data-go')); return; }
  const d = t.dataset;
  if (d.sheet) { if (d.sheet === 'fin' && !S.g) return; openSheet(d.sheet); return; }
  if (d.menu) { openMenu(); return; }
  if (d.open) { go('g-' + d.open); return; }
  if (d.player) { openSheet('player', d.player); return; }
  if (d.trade) { openSheet('trade', d.trade); return; }
  if (d.ch) { choose(d.ch); return; }
  if (d.emo) { sendEmo(d.emo); return; }
  if (d.av) { JS.av = d.av; JS.dream = $('#dream') ? $('#dream').value : JS.dream; document.querySelectorAll('[data-av]').forEach((b) => b.classList.toggle('on', b.dataset.av === d.av)); return; }
  if (d.dtab) { S.diaryTab = d.dtab; refreshSheet(true); return; }
  if (d.pub) { const uid = actor(); commit((g) => { const m = CF.pubSell(g, uid, d.pub); toast(esc(m), 'good'); }); return; }
  if (d.deal) { const uid = S.g.local && S.g.pending && S.g.pending.offer ? S.g.pending.offer.to : actor(); commit((g) => { toast(esc(CF.answerDeal(g, uid, d.deal === 'yes'))); }); if (d.deal === 'no') closeAll(); return; }
  if (d.tr) { const uid = actor(); commit((g) => { toast(esc(CF.tradeAnswer(g, uid, d.tr, !!d.yes))); }); return; }
  if (d.propose) {
    const k = CF.CUR === 'usd' ? S.g.world.fx : 1;
    const give = { cash: (+($('#tgc').value) || 0) * k, assets: [...document.querySelectorAll('[data-tg]:checked')].map((x) => x.dataset.tg) };
    const get = { cash: (+($('#trc').value) || 0) * k, assets: [...document.querySelectorAll('[data-tr2]:checked')].map((x) => x.dataset.tr2) };
    const note = $('#tnote').value; const to = d.propose; const uid = actor();
    commit((g) => { toast(esc(CF.propose(g, uid, to, give, get, note)), 'good'); }); openSheet('trades'); return;
  }
  if (d.adj) { const k = CF.CUR === 'usd' ? S.g.world.fx : 1; const v = (+($('#adjv').value) || 0) * k; const n = $('#adjn').value; commit((g) => { CF.adjust(g, d.adj, v, n); }); toast('Готово', 'good'); return; }
  if (d.cq) { const el = $('#cinp'); const v = CF.view(S.g); if (el && v && v.input) { const mx = +el.max; const st = +el.step || 1; el.value = Math.floor(mx * +d.cq / st) * st; const r = $('#crng'); if (r) r.value = el.value; el.dispatchEvent(new Event('input')); } return; }
  if (d.q) { const el = $('#bsum'); const p = S.g.players[actor()]; if (el && p) el.value = Math.max(0, Math.floor((CF.CUR === 'usd' ? p.cash / S.g.world.fx : p.cash) * +d.q)); return; }
  if (d.buy) { const k = CF.CUR === 'usd' ? S.g.world.fx : 1; const sum = (+($('#bsum') ? $('#bsum').value : 0)) * k; if (d.buy === 'bond') doAct('bond', { sum }); else if (d.buy === 'dep') doAct('dep', { sum }); else doAct('buy', { sym: d.buy, sum }); return; }
  if (d.a) { doAct(d.a, { id: d.id, frac: d.frac, amt: d.amt, i: d.i }); return; }
  if (d.ins) { doAct('ins', { k: d.ins }); return; }
  if (d.well) { doAct('well', { k: d.well }); return; }
  if (d.dev === 'live') { lifeToggle(); refreshSheet(true); return; }
  if (d.dev) { if (d.dev === 'snd') { SND.on = !SND.on; LS.set('cf_snd', SND.on ? '1' : '0'); } else { SND.voice = !SND.voice; LS.set('cf_voice', SND.voice ? '1' : '0'); if (SND.voice) speak('Озвучку увімкнено'); } refreshSheet(true); return; }
  if (d.rule) { commit((g) => CF.setRules(g, { [d.rule]: g.rules[d.rule] ? 0 : 1 })); return; }
  switch (d.act) {
    case 'create': createGame(); break;
    case 'local': startLocal(); break;
    case 'join': openJoin(); break;
    case 'jroll': rollProf(); break;
    case 'jok': joinOk(); break;
    case 'here': iAmHere(); break;
    case 'localStart': { const g = S.g; closeAll(); CF.setCtx(g); if (g.status === 'lobby') CF.startGame(g); onState(null); break; }
    case 'start': startGame(); break;
    case 'roll1': roll(false); break;
    case 'roll2': roll(true); break;
    case 'exit': exitRat(); break;
    case 'end': endTurn(); break;
    case 'card': openCard(); break;
    case 'menu': openMenu(); break;
    case 'close': closeAll(); break;
    case 'live': lifeToggle(); toast(LIFE.on ? '🌿 Живе поле увімкнено' : 'Поле статичне — без анімацій', '', 1800); break;
    case 'emo': S.emoOpen = !S.emoOpen; renderBottom(); break;
    case 'loan': { const k = CF.CUR === 'usd' ? S.g.world.fx : 1; doAct('loan', { amt: (+($('#lsum') ? $('#lsum').value : 0)) * k }); break; }
    case 'offerDeal': { const to = $('#dto').value; const k = CF.CUR === 'usd' ? S.g.world.fx : 1; const pr = (+($('#dprice').value) || 0) * k; const uid = actor(); commit((g) => { toast(esc(CF.offerDeal(g, uid, to, pr)), 'good'); }); break; }
    case 'saveEmail': { const v = $('#myemail').value.trim(); commit((g) => { if (g.players[S.me.id]) g.players[S.me.id].email = v; }); toast('Пошту збережено', 'good'); break; }
    case 'export': exportResults('вручну', true); break;
    case 'minimize': closeAll(); toast('Картку згорнуто. Таймер іде далі. Повернутися — кнопкою внизу.', 'blue', 3500); break;
    case 'cancelOffer': commit((g) => CF.cancelOffer(g)); break;
    case 'saveRules': { const r = { roll: +$('#r_roll').value, dec: +$('#r_dec').value, cur: $('#r_cur').value, news: $('#r_news').value }; commit((g) => CF.setRules(g, r)); toast('Правила збережено', 'good'); break; }
    case 'pause': commit((g) => CF.pause(g, !g.paused)); break;
    case 'skip': commit((g) => { CF.L(g, 'Хост пропустив хід.', 'sys', CF.curUid(g)); CF.endTurn(g); }); closeAll(); break;
    case 'del': modal(head('Видалити гру?') + '<div class="sbody"><p>Гра зникне для всіх гравців. Скасувати не можна.</p><button class="btn red" data-act="delyes">Так, видалити</button><button class="btn" data-act="close">Ні</button></div>', 'confirm'); break;
    case 'delyes': (async () => { try { await S.db.doc('games/' + S.gid).delete(); closeAll(); go(''); } catch (er) { toast('Не вдалося видалити (' + esc(er.code) + ').', 'bad'); } })(); break;
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && (S.sheet || S.drawer) && S.sheet !== 'join') { e.preventDefault(); closeAll(); } if (e.key === 'Enter' && e.target && e.target.classList && e.target.classList.contains('bal')) openSheet('fin'); });
document.addEventListener('focusout', () => setTimeout(() => { if (S.sheet && S.sheet !== 'card' && S.sheet !== 'join' && S.sheet !== 'trade' && S.sheet !== 'diary') { const m = $('#scrim'); if (m && !m.contains(document.activeElement)) refreshSheet(); } }, 200));
addEventListener('beforeunload', () => saveDiary(true));
let rzT; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (S.g && $('#board')) renderBoard(); }, 150); });
boot();
})();
</script>
</body>
</html>

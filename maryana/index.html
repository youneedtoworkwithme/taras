<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta property="og:title" content="Зимовий календар"><meta property="og:description" content="Нове віконце щодня до Різдва"><meta name="theme-color" content="#0b1730"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body>

<style>
/* Layout: a frosted night window over Lviv — header with countdown, a 5×5 wall of advent doors, rooftops along the bottom; each door opens into a sheet */
:root {
  --night: #0b1730;
  --night-2: #142a4f;
  --ice: #bfe0f2;
  --snow: #f4f8fc;
  --cran: #d93a52;
  --cran-deep: #a8213a;
  --pine: #1f6a52;
  --gold: #f3c96f;
  --paper: #fdf8ef;
  --ink: #22160f;
  --ink-soft: #6a584c;
  --muted: #9fb3cf;
  --line: rgba(220, 235, 255, .16);
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Onest", system-ui, -apple-system, sans-serif;
  --f-hand: "Caveat", "Segoe Script", cursive;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  margin: 0; color: var(--snow); font-family: var(--f-body); font-size: 16px; line-height: 1.5; overflow-x: hidden;
  background:
    radial-gradient(70% 40% at 80% 0%, rgba(191,224,242,.18), transparent 70%),
    radial-gradient(60% 40% at 10% 30%, rgba(120,90,200,.14), transparent 70%),
    linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%) fixed, var(--night);
}
button { font-family: inherit; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
#snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

.wrap {
  position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding-block: 18px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.kicker { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; color: var(--gold); }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(32px, 9vw, 56px); line-height: .98; letter-spacing: -.02em; margin: 6px 0 0; text-wrap: balance; }
h1 em { font-style: normal; color: var(--ice); }
.icon-btn { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.06); cursor: pointer; display: grid; place-items: center; color: var(--gold); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn[aria-pressed="false"] { color: var(--muted); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.stat b { font-family: var(--f-display); font-weight: 800; font-size: 28px; color: var(--gold); font-variant-numeric: tabular-nums; line-height: 1; }
.stat span { font-size: 13px; color: var(--muted); line-height: 1.2; }
.banner { border-radius: 16px; padding: 12px 14px; background: rgba(243,201,111,.12); border: 1px solid rgba(243,201,111,.35); font-size: 14px; color: var(--snow); }
.banner b { color: var(--gold); }

/* the wall of doors */
.wall { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 600px) { .wall { gap: 12px; } }
.door {
  position: relative; aspect-ratio: 1; max-width: 100%; border: 0; padding: 0; cursor: pointer; perspective: 600px; background: none;
}
.door .back {
  position: absolute; inset: 0; border-radius: 14px; background: rgba(0,0,0,.35); box-shadow: inset 0 0 0 1px var(--line);
  display: grid; place-items: center;
}
.door .back svg { width: 46%; height: 46%; opacity: .9; }
.door .back .bn { position: absolute; top: 6px; left: 8px; font-family: var(--f-display); font-weight: 800; font-size: clamp(10px, 2.6vw, 14px); color: var(--muted); }
.door .leaf {
  position: absolute; inset: 0; border-radius: 14px; transform-origin: left center; transition: transform .7s cubic-bezier(.3,.8,.3,1);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: var(--c, var(--cran)); box-shadow: 0 10px 20px -12px rgba(0,0,0,.8), inset 0 0 0 2px rgba(255,255,255,.12);
  backface-visibility: hidden;
}
.door .leaf::after { content: ""; position: absolute; right: 9%; top: 50%; width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.55); transform: translateY(-50%); }
.door .num { font-family: var(--f-display); font-weight: 800; font-size: clamp(18px, 6vw, 34px); line-height: 1; color: #fff; font-variant-numeric: tabular-nums; }
.door .dw { font-size: clamp(9px, 2.4vw, 12px); color: rgba(255,255,255,.75); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.door .cap { position: absolute; left: 6%; right: 6%; top: -5px; height: 10px; background: radial-gradient(circle at 7px 5px, #fff 5.5px, transparent 6px) 0 0 / 14px 10px repeat-x; pointer-events: none; z-index: 2; }
.door.opened .leaf { transform: rotateY(-105deg); }
.door.opened .cap { display: none; }
.door.locked .leaf { filter: saturate(.55) brightness(.75); }
.door.locked .leaf .lk { position: absolute; bottom: 8%; width: 14px; height: 14px; opacity: .8; }
.door.today .leaf { box-shadow: 0 0 0 3px var(--gold), 0 0 24px 4px rgba(243,201,111,.45); animation: glow 2s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 3px var(--gold), 0 0 34px 8px rgba(243,201,111,.65); } }
.door.special .leaf::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, transparent 44%, rgba(243,201,111,.9) 44% 56%, transparent 56%), linear-gradient(0deg, transparent 44%, rgba(243,201,111,.9) 44% 56%, transparent 56%); opacity: .55; pointer-events: none; }
.door.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }

.city { position: relative; z-index: 1; display: block; width: 100%; height: auto; margin-top: 24px; }
.foot { position: relative; z-index: 1; text-align: center; font-size: 13px; color: var(--muted); padding: 10px 16px calc(24px + env(safe-area-inset-bottom, 0px)); background: #0d1a2f; }
.foot b { color: var(--snow); font-weight: 600; }

/* sheet */
.sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(5,10,25,.6); backdrop-filter: blur(4px); display: grid; align-items: end; justify-items: center; }
@media (min-width: 700px) { .sheet-bg { align-items: center; } }
.sheet {
  position: relative; width: 100%; max-width: 560px; max-height: calc(100% - env(safe-area-inset-top, 0px) - 24px); overflow-y: auto;
  background: var(--paper); color: var(--ink); border-radius: 26px 26px 0 0; box-sizing: border-box;
  padding: 22px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  animation: up .4s cubic-bezier(.2,.9,.3,1.05); display: flex; flex-direction: column; gap: 14px;
}
@media (min-width: 700px) { .sheet { border-radius: 26px; padding: 26px 28px 26px; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet .s-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet .tag { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--cran-deep); }
.close { width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(34,22,15,.08); cursor: pointer; display: grid; place-items: center; color: var(--ink); flex: 0 0 auto; }
.close svg { width: 16px; height: 16px; }
.sheet h2 { font-family: var(--f-display); font-weight: 800; font-size: clamp(22px, 6vw, 30px); line-height: 1.12; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.letter { font-family: var(--f-hand); font-weight: 600; font-size: 25px; line-height: 1.22; margin: 0; white-space: pre-line; }
.sign { font-family: var(--f-hand); font-weight: 700; font-size: 26px; color: var(--cran-deep); text-align: right; margin: 0; }
.p { margin: 0; color: var(--ink-soft); }
.btn { border: 0; border-radius: 999px; padding: 15px 22px; cursor: pointer; font: 700 16px/1.1 var(--f-body); display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .12s, filter .12s; text-decoration: none; }
.btn:active { transform: scale(.97); }
.btn:hover { filter: brightness(1.06); }
.btn-main { background: var(--cran); color: #fff; }
.btn-gold { background: var(--gold); color: var(--ink); }
.btn-soft { background: rgba(34,22,15,.08); color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > span { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid rgba(34,22,15,.15); background: #fff; border-radius: 999px; padding: 10px 14px; cursor: pointer; font: 600 15px/1.2 var(--f-body); color: var(--ink); }
.chip.sel { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.input, textarea.input { font: 500 16px/1.4 var(--f-body); border: 1.5px solid rgba(34,22,15,.15); border-radius: 14px; padding: 12px 14px; background: #fff; color: var(--ink); width: 100%; box-sizing: border-box; }
textarea.input { min-height: 110px; resize: vertical; font-family: var(--f-hand); font-size: 22px; }
.done-box { background: #eef7f1; border: 1.5px solid #9fd3b6; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.done-box b { color: var(--pine); }
.fallback { background: #fff4dc; border: 1.5px solid #ecc672; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.fallback .msg { background: #fff; border-radius: 10px; padding: 10px 12px; white-space: pre-line; user-select: all; }
.small { font-size: 13px; color: var(--ink-soft); margin: 0; }

/* games */
.game { position: relative; border-radius: 18px; overflow: hidden; background: linear-gradient(180deg, #13284c, #2a4a7a); color: var(--snow); touch-action: none; user-select: none; -webkit-user-select: none; }
.game canvas { display: block; width: 100%; height: 340px; }
.ghud { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; font-weight: 700; font-variant-numeric: tabular-nums; pointer-events: none; }
.gover { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; background: rgba(11,23,48,.72); }
.gover div { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.gover b { font-family: var(--f-display); font-size: 22px; }
.mem { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.mem button { aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 12px; cursor: pointer; font-size: clamp(24px, 7vw, 34px); background: var(--night-2); color: transparent; transition: transform .25s, background .25s; }
.mem button.up, .mem button.ok { background: #fff; color: inherit; box-shadow: inset 0 0 0 2px rgba(34,22,15,.12); }
.mem button.ok { background: #eef7f1; }
.ana-word { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; min-height: 48px; }
.ana-word i { width: 38px; height: 46px; border-radius: 10px; background: rgba(34,22,15,.08); display: grid; place-items: center; font-style: normal; font-family: var(--f-display); font-weight: 800; font-size: 20px; }
.ana-tiles { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.ana-tiles button { width: 44px; height: 50px; border: 0; border-radius: 12px; background: var(--ink); color: var(--paper); font: 800 20px/1 var(--f-display); cursor: pointer; }
.ana-tiles button:disabled { opacity: .15; }
.shakey { animation: shake .4s; }
.treeg { width: 100%; max-width: 300px; margin: 0 auto; display: block; }
.treeg .slot { cursor: pointer; }
.findg { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.findg button { aspect-ratio: 1; border: 0; border-radius: 10px; background: #e8f1f9; cursor: pointer; display: grid; place-items: center; padding: 0; }
.findg button svg { width: 70%; height: 70%; }
.quiz-q { display: flex; flex-direction: column; gap: 10px; }
.quiz-q .chip.right { background: #2f8a5f; color: #fff; border-color: #2f8a5f; }
.quiz-q .chip.wrong { background: #e9d6d9; border-color: #e9d6d9; }
.scratch { position: relative; border-radius: 18px; overflow: hidden; touch-action: none; }
.scratch .prize { padding: 28px 22px; min-height: 180px; display: flex; flex-direction: column; justify-content: center; gap: 6px; background: linear-gradient(160deg, #fff6dc, #ffe2a0); text-align: center; box-sizing: border-box; }
.scratch .prize b { font-family: var(--f-display); font-size: 22px; color: var(--cran-deep); }
.scratch canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
.cookie { display: grid; place-items: center; padding: 10px; }
.cookie button { border: 0; background: none; cursor: pointer; font-size: 84px; line-height: 1; transition: transform .2s; }
.cookie button:hover { transform: rotate(-8deg) scale(1.05); }
.fortune { text-align: center; font-family: var(--f-hand); font-size: 28px; line-height: 1.2; margin: 0; }
.sky { position: relative; height: 220px; border-radius: 18px; overflow: hidden; background: radial-gradient(120% 100% at 50% 100%, #2a4a7a, #0b1730); cursor: pointer; }
.sky .bigstar { position: absolute; left: 50%; top: 40%; width: 64px; height: 64px; transform: translate(-50%, -50%); animation: tw 2s ease-in-out infinite; }
@keyframes tw { 50% { transform: translate(-50%, -50%) scale(1.15); filter: drop-shadow(0 0 14px #f3c96f); } }
.sky .shoot { position: absolute; width: 120px; height: 2px; background: linear-gradient(90deg, #fff, transparent); transform: rotate(-25deg); animation: shoot 1.2s ease-out forwards; }
@keyframes shoot { from { left: 80%; top: 10%; opacity: 1; } to { left: -20%; top: 70%; opacity: 0; } }
.summary { display: flex; flex-direction: column; gap: 6px; background: #fff; border-radius: 16px; padding: 14px 16px; }
.summary div { display: flex; gap: 8px; font-size: 15px; }
.summary div b { min-width: 0; }

#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }
.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -20px); z-index: 70; background: var(--snow); color: var(--ink); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  .door .leaf { transition: none; }
  .door.today .leaf, .sky .bigstar { animation: none; }
  .sheet { animation: none; }
}
</style>

<script>

   notify: що прилетить тобі в Telegram ({v} — її вибір/відповідь) */
const DAYS = [
  /* 1 */ { type: "note", title: "Привіт, Мар'яно!", text: "Це твій зимовий календар. Щодня до Різдва тут відкриватиметься одне віконце.\n\nУ деяких — просто кілька теплих слів. У деяких — маленька гра або завдання. А в деяких треба буде щось обрати, і я одразу про це дізнаюся. Що буде далі, не скажу.\n\nГарного тобі першого дня зими." },

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const ONLINE = /github\.io$/i.test(location.hostname);
const PREVIEW = !ONLINE || location.hash === "#admin";
let SIM = 0; // у режимі перегляду: 0 — усі відкриті, N — як побачить Мар'яна в день N
const KEY = "advent-maryana-2026";
let S = { opened: {}, done: {}, notified: {}, letter: "" };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === "object") S = Object.assign(S, s); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

function kyivToday() {
  const p = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Kyiv", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  return p; // YYYY-MM-DD
}
const toDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const dayDiff = (a, b) => Math.round((toDate(b) - toDate(a)) / 86400000);
const dateOf = n => { const d = toDate(START); d.setUTCDate(d.getUTCDate() + n - 1); return d; };
const label = n => { const d = dateOf(n); return `${d.getUTCDate()} ${MON}`; };
const wdShort = n => WDS[dateOf(n).getUTCDay()];
function todayIndex() { return PREVIEW && SIM ? SIM : dayDiff(START, kyivToday()) + 1; }  // 1 = перший день
function isOpenable(n) { return (PREVIEW && !SIM) || todayIndex() >= n; }

/* ---------- звук ---------- */
let audio = null, muted = false;
try { muted = localStorage.getItem(KEY + ":muted") === "1"; } catch (e) {}
function ac() { if (muted) return null; try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); } catch (e) { audio = null; } return audio; }
function tone(f, st, d, type = "sine", v = .1) { const a = ac(); if (!a) return; const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = f; const t = a.currentTime + st; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .05); }
const sBell = () => [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, i * .09, .8, "sine", .07));
const sTap = () => tone(880, 0, .1, "sine", .06);
const sWin = () => [659, 784, 988, 1319].forEach((f, i) => tone(f, i * .08, .45, "triangle", .1));
const sNo = () => { tone(330, 0, .2, "sine", .08); tone(262, .1, .25, "sine", .07); };
function paintMute() { $("mute").setAttribute("aria-pressed", String(!muted)); $("mute").setAttribute("aria-label", muted ? "Увімкнути звук" : "Вимкнути звук"); $("waves").hidden = muted; $("cross").hidden = !muted; }
$("mute").onclick = () => { muted = !muted; try { localStorage.setItem(KEY + ":muted", muted ? "1" : "0"); } catch (e) {} paintMute(); };
paintMute();

let toastT = 0;
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2400); }

/* ---------- надсилання тобі в Telegram ---------- */
async function notify(text, extra = {}) {
  if (!text) return true;
  const body = JSON.stringify(Object.assign({ text: (PREVIEW ? "[ТЕСТ] " : "") + text, test: PREVIEW }, extra));
  if (!SEND_URL) return false;
  try { await fetch(SEND_URL, { method: "POST", mode: "no-cors", body }); return true; } catch (e) { return false; }
}
function fill(tpl, vals) { return tpl.replace(/\{(\w+)\}/g, (_, k) => vals[k] ?? ""); }
function fallbackHtml(text) {
  return `<div class="fallback"><b>Не вдалося надіслати автоматично</b><span>Надішли, будь ласка, Тарасу це повідомлення сама:</span><div class="msg" id="fbMsg">${esc(text)}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-gold" type="button" id="fbCopy">Скопіювати</button><a class="btn btn-soft" href="${FALLBACK_TG}" target="_blank" rel="noopener">Відкрити Telegram</a></div></div>`;
}
function bindFallback(text) {
  const b = $("fbCopy"); if (!b) return;
  b.onclick = () => { try { navigator.clipboard.writeText(text).then(() => toast("Скопійовано"), sel); } catch (e) { sel(); } };
  const sel = () => { const r = document.createRange(); r.selectNodeContents($("fbMsg")); const g = getSelection(); g.removeAllRanges(); g.addRange(r); toast("Виділено, скопіюй"); };
}
/* надіслати й показати результат у контейнері */
async function sendAndShow(box, text, doneText, extra) {
  const ok = await notify(text, extra);
  box.innerHTML = `<div class="done-box"><b>${esc(doneText)}</b>${PREVIEW && !SEND_URL ? `<span class="small">Режим перегляду: у Telegram прийшло б:<br>${esc(text).replace(/\n/g, "<br>")}</span>` : ""}</div>` + (ok || PREVIEW ? "" : fallbackHtml(text));
  bindFallback(text);
}

function renderWall() {
  const ti = todayIndex();
  $("wall").innerHTML = DAYS.map((d, i) => {
    const n = i + 1, open = !!S.opened[n], can = isOpenable(n), today = n === ti;
    const c = d.special ? (n === 25 ? "#b8862a" : "#a8213a") : DOOR_COLORS[(i * 3) % DOOR_COLORS.length];
    return `<button class="door${open ? " opened" : ""}${!can ? " locked" : ""}${today && !open ? " today" : ""}${d.special ? " special" : ""}" type="button" data-n="${n}" role="listitem" aria-label="Віконце ${n}, ${label(n)}${!can ? ", ще зачинене" : open ? ", відкрите" : ""}" style="--c:${c}">
      <span class="back">${backIcon(d)}<span class="bn">${n}</span></span>
      <span class="leaf"><span class="num">${n}</span><span class="dw">${wdShort(n)}</span>${!can ? `<svg class="lk" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>` : ""}</span>
      ${!open ? `<span class="cap"></span>` : ""}
    </button>`;
  }).join("");
  $("wall").querySelectorAll(".door").forEach(b => b.onclick = () => tapDoor(+b.dataset.n, b));
  const opened = Object.keys(S.opened).length;
  $("sOpen").textContent = opened;
  const left = dayDiff(kyivToday(), "2026-12-25");
  $("sLeft").textContent = Math.max(0, left);
  $("sLeftL").textContent = left > 0 ? (left === 1 ? "день до Різдва" : left < 5 ? "дні до Різдва" : "днів до Різдва") : "Різдво!";
  let ban = "";

    const cols = ["#d93a52", "#f3c96f", "#bfe0f2", "#7a3e8f", "#ff8fa3"];
    let filled = 0;
    area.innerHTML = `<svg class="treeg" viewBox="0 0 200 240" aria-label="Ялинка">
      <rect x="90" y="208" width="20" height="24" rx="3" fill="#6b4226"/>
      <polygon points="100,110 34,212 166,212" fill="#1b6249"/><polygon points="100,70 46,160 154,160" fill="#217a57"/><polygon points="100,34 60,112 140,112" fill="#2a9264"/>
      <polygon id="tstar" points="100,10 104.4,20.9 116.2,21.7 107.1,29.3 110,40.8 100,34.5 90,40.8 92.9,29.3 83.8,21.7 95.6,20.9" fill="#3a4a63" stroke="#8aa0c0" stroke-width="1"/>
      ${slots.map(([x, y], i) => `<circle class="slot" data-i="${i}" cx="${x}" cy="${y}" r="8" fill="rgba(255,255,255,.08)" stroke="#fff" stroke-dasharray="3 3" stroke-width="1.4"/>`).join("")}
    </svg><p class="small" id="tl">Залишилось: ${slots.length}</p>`;
    area.querySelectorAll(".slot").forEach(s => s.addEventListener("click", () => {
      if (s.dataset.done) return; ac();
      s.dataset.done = 1; s.setAttribute("fill", cols[filled % cols.length]); s.removeAttribute("stroke-dasharray"); s.setAttribute("stroke", "rgba(255,255,255,.6)");
      tone([1047, 1175, 1319, 1397, 1568, 1760, 1976, 2093, 2349, 2637][filled], 0, .6, "sine", .07); filled++;
      $("tl").textContent = filled < slots.length ? `Залишилось: ${slots.length - filled}` : "Готово!";
      if (filled === slots.length) { $("tstar").setAttribute("fill", "#f3c96f"); $("tstar").setAttribute("stroke", "#fff1c9"); $("tstar").style.filter = "drop-shadow(0 0 8px #f3c96f)"; end(1); }
    }));
  },
  find(area, d, end) {
    let round = 0;
    const SF = `<svg viewBox="0 0 24 24" fill="none" stroke="#7aa6c8" stroke-width="1.8" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17l17.4-10"/></svg>`;
    const HT = c => `<svg viewBox="-12 -12 24 22"><path d="${HEART}" fill="${c}"/></svg>`;
    const go = () => {
      const n = [24, 30, 36][round], h = Math.floor(Math.random() * n), col = ["#ff6f8a", "#c7a5c9", "#a9bfd6"][round];
      area.innerHTML = `<p class="small">Раунд ${round + 1} з 3</p><div class="findg">${Array.from({ length: n }, (_, i) => `<button type="button" data-i="${i}" aria-label="${i === h ? "Сердечко" : "Сніжинка"}">${i === h ? HT(col) : SF}</button>`).join("")}</div>`;
      area.querySelectorAll(".findg button").forEach(b => b.onclick = () => {
        ac();
        if (+b.dataset.i === h) { tone(1320, 0, .25, "sine", .08); round++; if (round < 3) go(); else { area.innerHTML = `<p class="fortune">Усі три знайдено 💗</p>`; end(3); } }
        else { sNo(); b.classList.remove("shakey"); void b.offsetWidth; b.classList.add("shakey"); }
      });
    };
    go();
  },
  quiz(area, d, end) {
    let qi = 0, right = 0;
    const show = () => {
      const Q = d.qs[qi];
      area.innerHTML = `<div class="quiz-q"><p class="small">Питання ${qi + 1} з ${d.qs.length}</p><p class="letter" style="font-size:24px">${esc(Q.q)}</p><div class="chips">${Q.a.map((a, k) => `<button class="chip" type="button" data-k="${k}">${esc(a)}</button>`).join("")}</div></div>`;
      area.querySelectorAll(".chip").forEach(c => c.onclick = () => {
        ac(); const k = +c.dataset.k;
        area.querySelectorAll(".chip").forEach(x => { x.disabled = true; if (+x.dataset.k === Q.r) x.classList.add("right"); });
        if (k === Q.r) { right++; tone(1100, 0, .2, "sine", .07); } else { c.classList.add("wrong"); sNo(); }
        setTimeout(() => { qi++; if (qi < d.qs.length) show(); else { area.innerHTML = `<p class="fortune">${right} з ${d.qs.length}! ${right === d.qs.length ? "Ти знаєш мене краще, ніж я думав." : "Нічого, у нас ще буде час познайомитися ближче."}</p>`; end(`${right} з ${d.qs.length}`); } }, 900);
      });
    };
    show();
  }
};

/* ---------- конфеті й сніг ---------- */
const fx = $("fx"), fg = fx.getContext("2d"); let fp = [], frun = false;
function confetti(n) {
  if (reduce) return;
  const dpr = Math.min(2, devicePixelRatio || 1); fx.width = innerWidth * dpr; fx.height = innerHeight * dpr; fg.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (let i = 0; i < n; i++) fp.push({ x: innerWidth / 2 + (Math.random() - .5) * 140, y: innerHeight * .45, vx: (Math.random() - .5) * 13, vy: -6 - Math.random() * 9, s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .2, life: 0, c: ["#d93a52", "#f3c96f", "#ffffff", "#bfe0f2"][i % 4] });
  if (!frun) { frun = true; requestAnimationFrame(fstep); }
}
function fstep() {
  fg.clearRect(0, 0, innerWidth, innerHeight);
  fp.forEach(p => { p.vy += .28; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++; fg.save(); fg.translate(p.x, p.y); fg.rotate(p.r); fg.scale(p.s / 12, p.s / 12); fg.fillStyle = p.c; fg.fill(new Path2D(HEART)); fg.restore(); });
  fp = fp.filter(p => p.y < innerHeight + 20 && p.life < 240);
  if (fp.length) requestAnimationFrame(fstep); else { frun = false; fg.clearRect(0, 0, innerWidth, innerHeight); }
}
const snowC = $("snow"), sg = snowC.getContext("2d"); let flakes = [], snowRaf = 0;
function snowSize() {
  const d = Math.min(2, devicePixelRatio || 1); snowC.width = innerWidth * d; snowC.height = innerHeight * d; sg.setTransform(d, 0, 0, d, 0, 0);
  const n = Math.round(Math.min(120, Math.max(40, innerWidth * innerHeight / 9000)));
  flakes = Array.from({ length: n }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: .8 + Math.random() * 2.4, v: .25 + Math.random() * .7, a: Math.random() * 6, o: .3 + Math.random() * .6 }));
  if (reduce) snowDraw(false);
}
function snowDraw(m) {
  sg.clearRect(0, 0, innerWidth, innerHeight);
  flakes.forEach(f => { if (m) { f.y += f.v; f.a += .01; f.x += Math.sin(f.a) * .3; if (f.y > innerHeight + 4) { f.y = -4; f.x = Math.random() * innerWidth; } } sg.beginPath(); sg.arc(f.x, f.y, f.r, 0, 7); sg.fillStyle = `rgba(255,255,255,${f.o})`; sg.fill(); });
}
function snowLoop() { snowDraw(true); snowRaf = requestAnimationFrame(snowLoop); }
addEventListener("resize", snowSize);
document.addEventListener("visibilitychange", () => { cancelAnimationFrame(snowRaf); if (!document.hidden && !reduce) snowLoop(); if (!document.hidden) renderWall(); });
snowSize(); if (!reduce) snowLoop();

renderWall();
/* відкрити сьогоднішнє, якщо прийшла за посиланням з #today */
if (location.hash === "#today") { const t = todayIndex(); if (t >= 1 && t <= TOTAL) { const el = document.querySelector(`.door[data-n="${t}"]`); if (el) setTimeout(() => tapDoor(t, el), 400); } }
</script>
